[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-model-debates"
version = "0.1.0"
description = "Terminal-first multi-model collaboration workspace"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
mmd = "mmd.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*", "mmd*"]
